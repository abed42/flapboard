<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Split-flap tile: top flap slightly lighter than the bottom, letter sliced by the flap gap -->
  <defs>
    <clipPath id="tile">
      <rect x="8" y="8" width="240" height="240" rx="40" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- top flap -->
    <rect x="8" y="8" width="240" height="120" fill="#27272A" />
    <!-- bottom flap -->
    <rect x="8" y="128" width="240" height="120" fill="#18181B" />
    <!-- letter F -->
    <g fill="#FAFAFA">
      <rect x="92" y="58" width="30" height="140" />
      <rect x="92" y="58" width="82" height="28" />
      <rect x="92" y="122" width="66" height="26" />
    </g>
    <!-- flap gap slicing through the letter -->
    <rect x="8" y="125" width="240" height="6" fill="#09090B" />
    <!-- side pivot pins -->
    <circle cx="20" cy="128" r="7" fill="#09090B" />
    <circle cx="236" cy="128" r="7" fill="#09090B" />
  </g>
  <!-- hairline border so the tile reads on light backgrounds -->
  <rect x="9" y="9" width="238" height="238" rx="39" stroke="#3F3F46" stroke-width="2" fill="none" />
</svg>
